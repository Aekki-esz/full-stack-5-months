<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attribute Selectors Workshop</title>
    <link rel="stylesheet" href="style_12.css" />
  </head>

  <body>
    <h1>Attribute Selectors</h1>

    <section>
      <h2>Form</h2>

      <input type="text" placeholder="Name" />
      <input type="email" placeholder="Email" />
      <input type="password" placeholder="Password" />
    </section>

    <section>
      <h2>Links</h2>

      <a href="manual.pdf">Manual PDF</a>
      <a href="about.html">About</a>
      <a href="https://youtube.com">YouTube</a>
      <a href="https://google.com" title="Search Engine">Google</a>
    </section>

    <section>
      <h2>Messages</h2>

      <p class="message">Normal Message</p>
      <p class="message warning">Warning Message</p>
      <p class="message danger">Danger Message</p>
      <p class="message-danger">Another Message</p>
    </section>

    <section>
      <h2>Boxes</h2>

      <div class="box-info">Information</div>
      <div class="box-warning">Warning</div>
      <div class="box-error">Error</div>
      <div class="normal-box">Normal Box</div>
    </section>
  </body>
</html>
